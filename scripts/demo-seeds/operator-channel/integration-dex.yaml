# 演示环境集成客户端族的发行方（票 product-strategy-boundary/31）：只签 OAuth 2.0 客户端凭据许可的令牌，parcel-api
# 按它公布的公钥集校验（ADR-0149 决定三）。只为隔离演示环境准备，不是部署描述符；客户端口令是合成值。
#
# 与操作者族的发行方（dex.yaml）分开起：两族的信任锚是两组部署参数，受众也不同，一族的令牌过不了另一族的校验。
#
# 首方客户族（ADR-0139 决定二；票 first-party-api/00）也由这只发行方签：它与集成客户端族同是客户端凭据许可，落在同一个发行方
# 实例上是演示部署的决定。两边的受众各是一个静态客户端、trustedPeers 各列各的客户端，一个客户端取不到另一族受众的令牌；parcel-api
# 的首方族参数取同一个发行方地址与公钥集、受众取 idp-parcel-customer-api。
issuer: http://127.0.0.1:5558/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  grantTypes:
    - client_credentials
  skipApprovalScreen: true

staticClients:
  # 本产品在这只发行方那里的受众。它不登进集成客户端册，拿它取的令牌过得了校验也答未授予；两只合成客户端取令牌时
  # 带 audience:server:client_id 范围，令牌的 aud 才含它——parcel-api 的集成客户端受众参数就取这一串。
  # trustedPeers 列的是被允许这样做的客户端。
  - id: idp-parcel-integration
    name: 包裹网络集成接口（演示受众）
    secret: syn-integration-audience-secret
    redirectURIs:
      - http://127.0.0.1/unused
    trustedPeers:
      - syn-integration-customs-broker-01
      - syn-integration-bank-01
      - syn-integration-carrier-trunk-01
  # 一个客户端只代表一个外部方（accessidentity.IntegrationClientBinding）：报关服务商与银行各一台。
  - id: syn-integration-customs-broker-01
    name: 合成报关服务商 01
    secret: syn-customs-broker-secret
    redirectURIs:
      - http://127.0.0.1/unused
    grantTypes:
      - client_credentials
  - id: syn-integration-bank-01
    name: 合成银行 01
    secret: syn-bank-secret
    redirectURIs:
      - http://127.0.0.1/unused
    grantTypes:
      - client_credentials
  # 合成干线承运商的承运系统（票 demo-chain-gaps/24）：答复干线订舱。它代表的来源身份是干线承运方 SYN-PARTY-CARRIER-TRUNK-01
  # ——干线委托的服务提供方，答复口只认它答干线订舱（ADR-0202 决定二）。
  - id: syn-integration-carrier-trunk-01
    name: 合成干线承运商 01
    secret: syn-carrier-trunk-secret
    redirectURIs:
      - http://127.0.0.1/unused
    grantTypes:
      - client_credentials

  # 本产品客户 API 在这只发行方那里的受众（首方客户族）。它不登进客户渠道册；合成客户端取令牌时带
  # audience:server:client_id:idp-parcel-customer-api 范围，令牌的 aud 才含它。只列首方客户端：集成客户端取不到这一族的受众。
  - id: idp-parcel-customer-api
    name: 包裹网络客户 API（演示受众）
    secret: syn-customer-api-audience-secret
    redirectURIs:
      - http://127.0.0.1/unused
    trustedPeers:
      - syn-customer-client-01
  # 一个首方客户端只代表一个客户账户（accessidentity.CustomerClientBinding）：合成货主 SYN-ACCOUNT-01 的系统。
  - id: syn-customer-client-01
    name: 合成货主系统 01
    secret: syn-customer-client-secret
    redirectURIs:
      - http://127.0.0.1/unused
    grantTypes:
      - client_credentials

# Dex 至少要一只连接器才肯起；这里不登任何口令用户，口令连接器只是占位。
enablePasswordDB: true
