        ${first ? '' : `<table class="grid diff" style="border-top:1px solid var(--line-soft)"><colgroup><col style="width:34%"><col><col></colgroup>
          <thead><tr><th>项目</th><th>第 2 版</th><th>第 3 版</th></tr></thead><tbody>
          <tr style="cursor:default"><td>联系人 · 合成联系人甲 · 微信</td><td class="mono"><s>syn-wx-a</s></td><td class="mono">syn-wx-a-2026</td></tr>
          <tr style="cursor:default"><td>联系人 · 合成联系人丙 · LINE</td><td class="mono"><s>syn-line-c</s></td><td><span class="none">移除</span></td></tr>
          <tr style="cursor:default"><td>税务与开票 · 开票地址</td><td><s>同注册地址</s></td><td>（合成地址）示例市示例区示例路 9 号</td></tr></tbody></table>
          <div class="morerow">这三条改动是静态页写死的示意，不随上一步填的内容变。</div>`}</section></div></div>
      <div class="ebar"><span class="grow">核对无误再登记；要改就回上一步。</span><button class="btn" data-act="edit-back">返回修改</button><button class="btn primary" data-act="edit-save">确认登记</button></div></section>`;
  }
  const meta = sec('meta', 'history', identity ? '这一次更正' : '这一次更新',
    `<div class="fgrid four">${fld('来源单据 *', '', 'placeholder="这次变更依据的单据号"')}${fld('生效时间 *', '2026-11-11T00:00', 'type="datetime-local"')}${fld(identity ? '更新序号' : '版本号', identity ? '2' : p.noProfile ? '1' : '3')}</div>`,
    identity ? '' : '这几格说的是这一次更新，不沿用上一版');
  const body = identity
    ? meta + sec('id', 'building', '单位身份', `<div class="fgrid">${fld('名称 *', p.name)}${fld('编码', p.id, 'disabled')}${fld('注册国家 / 地区', p.country || '')}
        <div class="fld"><span>终身注册号</span>${pairRow('统一社会信用代码', 'SYN-REG-' + tail + '01')}</div>
        <div class="fld full"><span>外部系统编码（按系统与用途各一）</span>${pairRow('财务系统 · 客户编码', 'SYN-EXT-' + tail, '系统与用途')}<button class="addrow" data-act="row-add" data-kind="pair">+ 添加外部编码</button></div></div>`, '编码登记后不能改')
    : meta
      + sec('names', 'building', '名称与地址', `<div class="fgrid">${fld('其他语言名称', p.alt || '')}<div class="fld"><span>名称、注册地与注册号</span><small style="line-height:32px">不在资料里改，去「更多 › 更正名称与识别信息」</small></div>
          ${fld('注册地址', p.noProfile ? '' : `（合成地址）示例市示例区示例路 ${Number(tail) || 1} 号`, '', 'full')}${fld('办公地址', '', 'placeholder="与注册地址相同可不填"', 'full')}${fld('通信地址', '', 'placeholder="与注册地址相同可不填"', 'full')}</div>`)
      + sec('tax', 'receipt', '税务与开票', `<div class="fgrid"><div class="fld full"><span>监管登记号</span>${p.noProfile ? '' : pairRow('纳税人识别号', 'SYN-TAX-' + tail + '0001')}<button class="addrow" data-act="row-add" data-kind="pair">+ 添加登记号</button></div>
          ${fld('开票抬头', p.noProfile ? '' : p.name)}${fld('开票地址', p.noProfile ? '' : '同注册地址')}</div>`)
      + sec('contacts', 'card', '联系人', `${contactsOf(p).map((c) => contactEdit(c)).join('')}<button class="addrow" data-act="row-add" data-kind="contact">+ 添加联系人</button>`)
      + sec('bank', 'bank', '收款账户', `${p.noProfile ? '' : bankEdit({ holder: p.name, bank: '合成银行示例支行', no: 'SYN-BANK-' + tail + '-0001', currency: 'CNY' })}<button class="addrow" data-act="row-add" data-kind="bank">+ 添加收款账户</button>`);
  return `<section class="panel detail editing" aria-label="${identity ? '更正名称与识别信息' : '更新资料'}">${head}
    <div class="ebody"><div class="ewrap"><nav class="enav" aria-label="表单分段">${(identity ? [['meta', '这一次更正'], ['id', '单位身份']] : [['meta', '这一次更新'], ['names', '名称与地址'], ['tax', '税务与开票'], ['contacts', '联系人'], ['bank', '收款账户']])
      .map(([id, label]) => `<button data-act="esec" data-sec="${id}">${label}</button>`).join('')}</nav><div class="eform">${body}</div></div><datalist id="platforms">${PLATFORMS.map((x) => `<option value="${x}">`).join('')}</datalist></div>
    <div class="ebar"><span class="grow">${identity ? '更正也是登记一笔新的，原来那一笔留在登记记录里。' : '保存前会先给你看改了哪几处。'}</span><button class="btn" data-act="edit-cancel">取消</button><button class="btn primary" data-act="edit-review">核对并保存</button></div></section>`;
}

/* ───── 新增往来单位：整页的登记视图。右边随打字列出名录里相近的单位——主数据最怕同一家登两次 ───── */
function dupesHtml() {
  const c = state.creating;
  const name = needle(c.name);
  const id = needle(c.id);
  const typed = name.length >= 2 || id.length >= 2;
  const hits = typed ? parties.filter((p) => (name.length >= 2 && p.name.toLowerCase().includes(name)) || (id.length >= 2 && p.id.toLowerCase().includes(id))).slice(0, 6) : [];
  return `<header>${ic('search')}名录里相近的单位</header>${hits.length
    ? `<div class="lines">${hits.map((p) => `<div data-act="open-existing" data-id="${p.id}" style="cursor:pointer">${tile(p)}<div class="grow"><span>${esc(p.name)}</span><small class="mono">${p.id}</small></div>${pill(STATUS[p.status])}</div>`).join('')}</div>
       <div class="morerow" style="padding:10px 14px">已经有了就不要再登一家：点开看看是不是同一家。</div>`
    : `<div class="ph" style="padding:24px 16px">${typed ? '没有相近的单位，可以登记。' : '输入名称或编码，这里会列出名录里相近的单位，避免同一家登两次。'}</div>`}`;
}
function createView() {
  const c = state.creating;
  const inp = (field, label, attrs = '', cls = '') => `<label class="fld ${cls}"><span>${label}</span><input class="inp" data-cf="${field}" value="${esc(c[field])}" ${attrs}></label>`;
  return `${pageHead()}
  <section class="panel" style="flex:1">
    <div class="subhead"><button class="btn ghost sm" data-act="create-cancel">${ic('left')}返回名录</button><h2>新增往来单位</h2></div>
    <div class="cbody">
      <div class="eform" style="margin:0;max-width:none">
        <section class="sec"><header>${ic('building')}单位身份</header><div class="bd"><div class="fgrid">
          ${inp('name', '名称 *', 'placeholder="营业执照或合同上的全称"', 'full')}
          ${inp('id', '编码 *', 'placeholder="如 SYN-PARTY-…" style="font-family:var(--mono)"')}<div class="fld"><span>&nbsp;</span><small style="line-height:32px">登记后不能改；建议沿用现有的客户或供应商编码</small></div>
          ${inp('from', '生效时间 *', 'type="date"')}${inp('basis', '来源单据 *', 'placeholder="登记依据的单据号"')}</div></div></section>
        <section class="sec"><header>${ic('receipt')}识别信息<span style="margin-left:8px;color:var(--muted);font-size:12px">选填，以后可以在「更正名称与识别信息」里补</span></header><div class="bd"><div class="fgrid">
          ${inp('country', '注册国家 / 地区', 'placeholder="如 CN"')}<div class="fld"><span>终身注册号</span>${pairRow()}</div>
          <div class="fld full"><span>外部系统编码（按系统与用途各一）</span><button class="addrow" data-act="row-add" data-kind="pair">+ 添加外部编码</button></div></div></div></section>
        <p class="meta" style="white-space:normal;line-height:20px">这里登记的是单位本身。它是客户还是供应商，登记之后用「登记合作关系」说；联系人、地址与收款账户在「更新资料」里登。</p>
      </div>
      <aside class="sec" id="dupes" aria-live="polite" style="align-self:start">${dupesHtml()}</aside>
    </div>
    <div class="ebar"><span class="grow">保存后直接打开这家单位。</span><button class="btn" data-act="create-cancel">取消</button><button class="btn primary" data-act="create-save">保存并打开</button></div>
  </section>`;
}
function saveParty() {
  const c = state.creating;
  const id = c.id.trim();
  const name = c.name.trim();
  if (!name || !id) return toast('名称与编码必填');
  // 空册里登了第一家，演示状态跟着回到「有数据」：静态页的空册只是一张空表，存不住东西
  if (demo === 'empty') { demo = 'ready'; demoSelect.value = 'ready'; useData(); }
  if (byId[id]) return toast('这个编码已经登记过了');
  const p = { id, name, status: c.from > TODAY ? 'REGISTERED' : 'EFFECTIVE', from: c.from, reg: TODAY, country: c.country.trim() || null, noProfile: true };
  parties.unshift(p);
  if (parties !== baseParties) baseParties.unshift(p);
  useData();
  Object.assign(state, { creating: null, q: '', type: 'ALL', status: 'ALL', page: 0, sel: id, dtab: 'overview' });
  return toast(`已登记 ${name}`);
}

/* ───── 对话框与一句话提示 ───── */
let toastTimer = 0;
function toast(text) {
  state.toast = text;
  clearTimeout(toastTimer);
  // 到点只摘掉这一个节点，不整页重画：这时候人可能正在别的格里打字
  toastTimer = setTimeout(() => { state.toast = null; const node = page.querySelector('.toast'); if (node) node.remove(); }, 2600);
}
function overlays() {
  const m = state.modal;
  let html = '';
  if (m && m.kind === 'deactivate') {
    const p = byId[m.id];
    const n = rels.filter((r) => live(r) && (r.holder === p.id || r.counterparty === p.id)).length;
    html = `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-label="停用"><header>停用「${esc(p.name)}」</header>
      <div class="dbd"><p style="color:var(--muted)">停用之后新的业务不再找它；已有的记录保留，停用本身也留一条登记记录。${n ? `它名下还有 ${fmt(n)} 段在用的合作关系。` : ''}</p>
        <div class="fgrid"><label class="fld"><span>停用时间 *</span><input class="inp" type="date" value="${TODAY}"></label><label class="fld"><span>版本号</span><input class="inp" value="2"></label>
          <label class="fld full"><span>来源单据 *</span><input class="inp" placeholder="停用依据的单据号"></label></div></div>
      <footer><button class="btn" data-act="modal-close">取消</button><button class="btn danger" data-act="deactivate-confirm">停用</button></footer></div></div>`;
  } else if (m && m.kind === 'discard') {
    html = `<div class="scrim"><div class="dialog" role="alertdialog" aria-modal="true" aria-label="放弃修改"><header>放弃修改？</header>
      <div class="dbd"><p style="color:var(--muted)">${m.what}还没有保存，离开后填写的内容不会保留。</p></div>
      <footer><button class="btn" data-act="modal-close">继续编辑</button><button class="btn danger" data-act="discard-confirm">放弃</button></footer></div></div>`;
  }
  return html + (state.toast ? `<div class="toast" role="status">${ic('check')}${esc(state.toast)}</div>` : '');
}

/* ───── 合作关系 ───── */
function relsFull() {
  const all = filteredRels();
  const list = pageOf(all, state.rpage);
  const filtered = state.rq || state.rrole !== 'ALL' || state.rstatus !== 'ALL';
  // 状态与角色读口本来就能筛，多页时照样精确；过渡期只是给不出各状态的数，芯片上只写词
  const chip = (s, label) => {
    if (s !== 'ALL' && state.rstatus !== s && !rels.some((r) => r.status === s)) return '';
    const n = relStatusCount(s);
    return `<button class="chip${state.rstatus === s ? ' on' : ''}" aria-pressed="${state.rstatus === s}" data-act="rstatus" data-s="${s}"${counted() && n === 0 && state.rstatus !== s ? ' disabled' : ''}>${s === 'CANDIDATE' ? '<i style="background:#e8930c"></i>' : ''}${label}${counted() ? `<span class="n">${fmt(n)}</span>` : ''}</button>`;
  };
  const colgroup = '<colgroup><col style="width:30%"><col style="width:180px"><col style="width:26%"><col style="width:120px"><col></colgroup>';
  const thead = '<thead><tr><th>单位</th><th>担任的角色</th><th>对方</th><th>状态</th><th>有效期</th></tr></thead>';
  const toolbar = `<div class="toolbar">
      <label class="search">${ic('search')}<input id="q" value="${esc(state.rq)}" placeholder="搜索单位名称、编码或关系编号" aria-label="搜索"><kbd>/</kbd></label>
      <select class="select${state.rrole !== 'ALL' ? ' on' : ''}" id="rrole" aria-label="角色"><option value="ALL">角色：全部</option>${Object.entries(ROLES).map(([k, v]) => `<option value="${k}"${state.rrole === k ? ' selected' : ''}>角色：${v.label}</option>`).join('')}</select>
      ${demo === 'loading' ? '' : `<span class="vsep"></span>
      <div class="chipset"><span class="lab">状态</span>${chip('ALL', '全部')}${Object.entries(REL_STATUS).map(([k, v]) => chip(k, v.label)).join('')}</div>`}
      ${filtered ? '<button class="clear" data-act="rclear">清除筛选</button>' : ''}
    </div>`;
  const other = stateBody('rels', colgroup, thead);
  if (other) return `${pageHead()}<section class="panel" style="flex:1">${tabs(true)}${other.toolbar ? toolbar : ''}${other.html}</section>`;
  const rows = list.map((r) => `<tr>
      <td>${ident(byId[r.holder])}</td>
      <td><span class="arrow">${ic('arrow')}</span>${roleTag(r.role)}<span class="arrow">${ic('arrow')}</span></td>
      <td>${ident(byId[r.counterparty], true)}</td>
      <td>${pill(REL_STATUS[r.status])}</td>
      <td class="num">${r.start} <span style="color:var(--deco)">→</span> ${r.end ? r.end : '<span style="color:var(--muted)">长期有效</span>'}</td></tr>`).join('');
  return `${pageHead()}
  <section class="panel" style="flex:1">
    ${tabs(true)}${toolbar}${state.relForm && state.relForm.ctx === null ? relFormHtml(null) : ''}
    <div class="tablewrap${busy() ? ' busy' : ''}">${progress()}${list.length ? `<table class="grid">${colgroup}${thead}<tbody>${rows}</tbody></table>`
      : '<div class="empty"><b>当前筛选条件下没有匹配的合作关系</b><button class="clear" data-act="rclear">清除筛选</button></div>'}</div>
    ${foot('lfoot', all.length, '段', 'rpage')}
  </section>`;
}

/* ───── 我方关联 ───── */
function networkFull() {
  const q = needle(state.nq);
  // 过渡期照现行页面：这一视图的段数从合作关系册的第一页数，页上写明
  const seen = interim() ? rels.slice(0, PAGE) : rels;
  const count = (list) => Object.keys(ROLES).map((role) => [role, list.filter((r) => r.role === role).length]).filter(([, n]) => n > 0);
  const cell = (pairs) => pairs.length ? `<div class="tags">${pairs.map(([role, n]) => `<span class="tag"><i style="background:${ROLES[role].color}"></i>${ROLES[role].label} <b class="num">${fmt(n)}</b></span>`).join('')}</div>` : '<span class="none">—</span>';
  const list = ours.filter((p) => !q || p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q) || p.le.toLowerCase().includes(q));
  const colgroup = '<colgroup><col class="c-name"><col style="width:28%"><col style="width:18%"><col style="width:110px"><col></colgroup>';
  const thead = '<thead><tr><th>我方公司</th><th>对它担任角色的单位</th><th>它对其担任角色</th><th>待确认</th><th>公司主体</th></tr></thead>';
  const toolbar = `<div class="toolbar">
      <label class="search">${ic('search')}<input id="q" value="${esc(state.nq)}" placeholder="搜索我方公司名称、编码或公司主体" aria-label="搜索"><kbd>/</kbd></label>
      ${interim() ? `<span class="pnote">${ic('info')}合作关系册不止一页，段数只按第一页数</span>` : '<span class="hint">以我方每家公司为主体看合作关系；选一家在右边看它的关系图</span>'}
    </div>`;
  const other = stateBody('network', colgroup, thead);
  if (other) return `${pageHead()}<section class="panel" style="flex:1">${tabs(true)}${other.toolbar ? toolbar : ''}${other.html}</section>`;
  const rows = list.map((p) => {
    const toward = seen.filter((r) => r.counterparty === p.id && live(r));
    const from = seen.filter((r) => r.holder === p.id && live(r));
    const pending = toward.concat(from).filter((r) => r.status === 'CANDIDATE').length;
    return `<tr data-act="nopen" data-id="${p.id}"><td>${ident(p)}</td><td>${cell(count(toward))}</td><td>${cell(count(from))}</td>
      <td>${pending ? `<span class="pill warn">${ic('clock')}${fmt(pending)} 段</span>` : '<span class="none">—</span>'}</td>
      <td class="mono" style="font-size:12px;color:var(--muted)">${p.le}</td></tr>`;
  }).join('');
  return `${pageHead()}
  <section class="panel" style="flex:1">
    ${tabs(true)}${toolbar}
    <div class="tablewrap${busy() ? ' busy' : ''}">${progress()}${list.length ? `<table class="grid">${colgroup}${thead}<tbody>${rows}</tbody></table>` : '<div class="empty"><b>没有匹配的我方公司</b></div>'}</div>
    ${foot('lfoot', list.length, '家', 'npage')}
  </section>`;
}

/* 我方关联选中一家：左边是我方公司的名录栏，右边是它的关系图。图上合成节点的门槛比往来单位右栏里宽一些，这里地方大 */
function networkSplit() {
  const p = byId[state.nsel];
  const q = needle(state.nq);
  const seen = interim() ? rels.slice(0, PAGE) : rels;
  const list = ours.filter((x) => !q || x.name.toLowerCase().includes(q) || x.id.toLowerCase().includes(q) || x.le.toLowerCase().includes(q));
  const summary = (x) => { const c = relIdx.get(x.id); return c ? `${fmt(c.n)} 段在用${c.pending ? ` · ${fmt(c.pending)} 段待确认` : ''}` : '暂无合作关系'; };
  const rows = list.map((x) => `<div class="mrow${x.id === p.id ? ' on' : ''}" data-act="nopen" data-id="${x.id}">${tile(x)}<div class="tx"><div class="nm trunc">${esc(x.name)}</div><div class="sub trunc">${summary(x)}</div></div></div>`).join('');
  const mine = seen.filter((r) => r.holder === p.id || r.counterparty === p.id);
  const alive = mine.filter(live);
  const byRole = (toward) => Object.keys(ROLES).map((role) => [role, alive.filter((r) => r.role === role && (toward ? r.counterparty === p.id : r.holder === p.id))]).filter(([, rs]) => rs.length);
  const roleLines = (toward) => byRole(toward).map(([role, rs]) => {
    const pending = rs.filter((r) => r.status === 'CANDIDATE').length;
    return `<div data-act="rels-of" data-id="${p.id}" data-role="${role}" style="cursor:pointer"><span class="tile ${role}" style="width:28px;height:28px;border-radius:6px">${ic(ROLES[role].icon)}</span>
      <div class="grow"><span>${ROLES[role].label}</span><small>${pending ? `其中 ${fmt(pending)} 段待确认` : '都已生效'}</small></div><span class="cntn">${fmt(rs.length)}</span>${ic('right', 'go')}</div>`;
  }).join('');
  const block = (icon, title, toward, none) => `<section class="sec"><header>${ic(icon)}${title}</header>${byRole(toward).length ? `<div class="lines">${roleLines(toward)}</div>` : `<div class="ph" style="padding:24px 16px">${none}</div>`}</section>`;
  return `<aside class="panel master" aria-label="我方公司">
    <div class="mhead"><h2>往来单位</h2></div>
    ${tabs(false)}
    <div class="mtools"><label class="search">${ic('search')}<input id="q" value="${esc(state.nq)}" placeholder="搜索我方公司" aria-label="搜索"><kbd>/</kbd></label></div>
    <div class="mlist">${rows || '<div class="empty"><b>没有匹配的我方公司</b></div>'}</div>
    ${foot('mfoot', list.length, '家', 'npage')}
  </aside>
  <section class="panel detail" aria-label="${esc(p.name)}">
    <div class="dhead" style="padding-bottom:14px"><div class="dtop">${tile(p)}
      <div class="tx"><div class="dname"><h2>${esc(p.name)}</h2>${pill(STATUS[p.status])}</div><div style="margin-top:6px">${typeTags(p)}</div></div>
      <div class="dacts"><button class="btn sm">${ic('external')}打开公司主体 <span class="mono">${p.le}</span></button><button class="btn sm" data-act="open" data-id="${p.id}">在单位名录里看</button>
        <button class="btn ghost sm icon" title="关闭（Esc）" aria-label="关闭" data-act="nclose">${ic('x')}</button></div></div></div>
    <div class="dbody flush" style="border-top:1px solid var(--line)"><div class="secs">
      <section class="sec"><header>${ic('link')}关系图<span class="hcnt">${fmt(alive.length)} 段在用</span><button class="more" data-act="rels-of" data-id="${p.id}">在「合作关系」里看全部</button></header>
        <div class="gwrap">${graph(p, mine, { roleLimit: 5, columnLimit: 8 })}</div></section>
      ${block('users', '对它担任角色的单位', true, '没有单位对它担任角色')}${block('route', '它对别的单位担任的角色', false, '它没有对别的单位担任角色')}</div></div>
  </section>`;
}

/* ───── 渲染与事件 ───── */
const page = document.getElementById('page');
function render() {
  const focused = document.activeElement && document.activeElement.id === 'q';
  const editing = listed() && state.edit && byId[state.edit.id];
  const creating = answered() && state.creating;
  const split = !editing && !creating && listed() && ((state.view === 'parties' && state.sel && byId[state.sel]) || (state.view === 'network' && state.nsel && byId[state.nsel]));
  page.className = 'page' + (split ? ' split' : '');
  const main = editing ? editView(byId[state.edit.id])
    : creating ? createView()
    : state.view === 'rels' ? relsFull()
    : state.view === 'network' ? (split ? networkSplit() : networkFull())
    : split ? partiesSplit() : partiesFull();
  page.innerHTML = main + overlays();
  if (focused) { const q = document.getElementById('q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
  const on = page.querySelector('.mrow.on'); if (on) on.scrollIntoView({ block: 'nearest' });
  if (editing && state.edit.sec) {
    const target = document.getElementById('esec-' + state.edit.sec); if (target) target.scrollIntoView({ block: 'start' });
    state.edit.sec = null;
  }
}
// 换演示状态：换数据、回第一页；新状态里没有的选中与筛选项一并放下
const demoSelect = document.getElementById('demo');
demoSelect.innerHTML = DEMOS.map(([value, label]) => `<option value="${value}">${label}</option>`).join('');
function setDemo(value) {
  demo = value;
  demoSelect.value = value;
  useData();
  state.page = 0; state.rpage = 0;
  if (!listed() || !byId[state.sel]) state.sel = null;
  if (!listed() || !byId[state.nsel]) state.nsel = null;
  if (interim() && state.type === 'NONE') state.type = 'ALL';
  Object.assign(state, { menu: false, modal: null, edit: null, relForm: null, creating: null });
  render();
}
demoSelect.addEventListener('change', (event) => setDemo(event.target.value));
page.addEventListener('click', (event) => {
  const el = event.target.closest('[data-act]');
  if (!el) { if (state.menu) { state.menu = false; render(); } return; }
  const act = el.dataset.act;
  if (act !== 'menu') state.menu = false;
  // 换条件回第一页：游标跟着条件走
  if (act === 'view') { state.view = el.dataset.v; state.relForm = null; }
  else if (act === 'menu') { state.menu = !state.menu; }
  else if (act === 'copy') { if (navigator.clipboard) navigator.clipboard.writeText(el.dataset.v).catch(() => {}); toast(`已复制 ${el.dataset.v}`); }
  else if (act === 'nopen') { state.nsel = el.dataset.id; }
  else if (act === 'nclose') { state.nsel = null; }
  else if (act === 'rel-new') { state.dtab = 'links'; openRelForm(state.sel); }
  else if (act === 'rel-new-global') { state.view = 'rels'; openRelForm(null); }
  else if (act === 'rf-swap') { state.relForm.dir = state.relForm.dir === 'from' ? 'toward' : 'from'; }
  else if (act === 'rf-cancel') { state.relForm = null; }
  else if (act === 'rf-save') { saveRel(); }
  else if (act === 'edit') { state.edit = { id: state.sel, step: 'form', kind: el.dataset.kind || 'profile', sec: el.dataset.sec || null, dirty: false }; }
  else if (act === 'esec') { const target = document.getElementById('esec-' + el.dataset.sec); if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  else if (act === 'edit-review') { state.edit.step = 'review'; }
  else if (act === 'edit-back') { state.edit.step = 'form'; }
  else if (act === 'edit-save') {
    const done = state.edit;
    state.edit = null;
    if (done.kind === 'profile') delete byId[done.id].noProfile;
    toast(done.kind === 'identity' ? '已登记更正，2026-11-11 起生效' : '已登记资料，2026-11-11 起生效');
  }
  else if (act === 'edit-cancel') { if (state.edit.dirty) state.modal = { kind: 'discard', what: '这次修改', target: 'edit' }; else state.edit = null; }
  // 增删一行直接动页面上的节点，不整页重画：别的格里已经填的字要留着
  else if (act === 'row-add') { el.insertAdjacentHTML('beforebegin', ROW_TEMPLATES[el.dataset.kind]()); if (state.edit) state.edit.dirty = true; return; }
  else if (act === 'row-del') { (el.closest('.srow') || el.closest('.erow')).remove(); if (state.edit) state.edit.dirty = true; return; }
  else if (act === 'deactivate') { state.modal = { kind: 'deactivate', id: state.sel }; }
  else if (act === 'deactivate-confirm') {
    const p = byId[state.modal.id];
    p.status = 'DEACTIVATED'; p.deactivatedAt = TODAY;
    state.modal = null;
    useData();
    toast(`已登记停用，自 ${TODAY} 起`);
  }
  else if (act === 'modal-close') { state.modal = null; }
  else if (act === 'discard-confirm') { const target = state.modal.target; state.modal = null; if (target === 'edit') state.edit = null; else state.creating = null; }
  else if (act === 'create') { state.view = 'parties'; state.creating = { name: '', id: '', from: TODAY, basis: '', country: '' }; }
  else if (act === 'create-cancel') { const c = state.creating; if (c.name || c.id || c.basis) state.modal = { kind: 'discard', what: '这家新单位', target: 'create' }; else state.creating = null; }
  else if (act === 'create-save') { saveParty(); }
  else if (act === 'open-existing') { state.creating = null; state.sel = el.dataset.id; state.dtab = 'overview'; }
  else if (act === 'type') { state.type = state.type === el.dataset.t ? 'ALL' : el.dataset.t; state.page = 0; }
  else if (act === 'rstatus') { state.rstatus = state.rstatus === el.dataset.s ? 'ALL' : el.dataset.s; state.rpage = 0; }
  else if (act === 'clear') { state.q = ''; state.type = 'ALL'; state.status = 'ALL'; state.page = 0; }
  else if (act === 'rclear') { state.rq = ''; state.rrole = 'ALL'; state.rstatus = 'ALL'; state.rpage = 0; }
  else if (act === 'open') { state.view = 'parties'; state.sel = el.dataset.id; state.dtab = 'overview'; state.relForm = null; }
  else if (act === 'close') { state.sel = null; state.relForm = null; }
  else if (act === 'dtab') { state.dtab = el.dataset.d; }
  else if (act === 'attn-rel') { state.view = 'rels'; state.rstatus = 'CANDIDATE'; state.rq = ''; state.rrole = 'ALL'; state.rpage = 0; }
  else if (act === 'attn-future') { state.view = 'parties'; state.status = 'REGISTERED'; state.type = 'ALL'; state.q = ''; state.sel = null; state.page = 0; }
  else if (act === 'rels-of') { state.view = 'rels'; state.rq = el.dataset.id; state.rrole = el.dataset.role || 'ALL'; state.rstatus = 'ALL'; state.rpage = 0; state.relForm = null; }
  else if (act === 'turn') {
    state[el.dataset.k] += Number(el.dataset.step);
    render();
    const box = page.querySelector('.tablewrap,.mlist'); if (box) box.scrollTop = 0;
    return;
  }
  else if (act === 'retry') { setDemo('loading'); setTimeout(() => setDemo('ready'), 900); return; }
  else if (act === 'refresh') {
    if (!listed() || flash) return;
    flash = true; render();
    setTimeout(() => { flash = false; render(); }, 700);
    return;
  }
  render();
});
page.addEventListener('input', (event) => {
  const data = event.target.dataset;
  // 表单里打字只记值，不重画；新增单位时顺手刷新右边的查重提示
  if (data.rf && state.relForm) { state.relForm[data.rf] = event.target.value; return; }
  if (data.cf && state.creating) { state.creating[data.cf] = event.target.value; document.getElementById('dupes').innerHTML = dupesHtml(); return; }
  if (state.edit && event.target.closest('.editing')) { state.edit.dirty = true; return; }
  if (event.target.id !== 'q') return;
  if (state.view === 'rels') { state.rq = event.target.value; state.rpage = 0; }
  else if (state.view === 'network') state.nq = event.target.value;
  else { state.q = event.target.value; state.page = 0; }
  render();
});
page.addEventListener('change', (event) => {
  const { id, value } = event.target;
  const field = event.target.dataset.rf;
  if (field && state.relForm) {
    state.relForm[field] = value;
    // 选了对方、角色或登记成什么，图上的虚线与要填的格跟着变；别的格只记值
    if (field === 'other' || field === 'holder' || field === 'role' || field === 'as') render();
    return;
  }
  if (id === 'status') state.status = value; else if (id === 'type') state.type = value; else if (id === 'rrole') state.rrole = value; else return;
  state.page = 0; state.rpage = 0;
  render();
});
document.addEventListener('keydown', (event) => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(event.target.tagName);
  if (event.key === '/' && !typing) { event.preventDefault(); const q = document.getElementById('q'); if (q) q.focus(); return; }
  if (event.key === 'Escape') {
    // 先关最上面那一层：对话框、菜单；正在填的东西不因为按了一下 Esc 就丢
    if (state.modal) { state.modal = null; render(); }
    else if (state.menu) { state.menu = false; render(); }
    else if (typing) event.target.blur();
    else if (state.edit || state.creating || state.relForm) return;
    else if (state.view === 'network' && state.nsel) { state.nsel = null; render(); }
    else if (state.sel) { state.sel = null; render(); }
    return;
  }
  if ((event.key === 'ArrowDown' || event.key === 'ArrowUp') && !typing && state.view === 'parties' && listed() && !state.edit && !state.creating && !state.modal && !state.relForm) {
    const list = shownParties(); if (!list.length) return;
    const index = list.findIndex((p) => p.id === state.sel);
    const next = index === -1 ? (event.key === 'ArrowDown' ? 0 : list.length - 1) : Math.min(list.length - 1, Math.max(0, index + (event.key === 'ArrowDown' ? 1 : -1)));
    event.preventDefault(); state.sel = list[next].id; state.dtab = 'overview'; render();
  }
});
setDemo('ready');
</script>
</body>
</html>
