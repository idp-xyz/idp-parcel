<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">IDP Parcel logo</title>
  <desc id="desc">简化的圆角立方体与路径负形，配 IDP Parcel 字标。</desc>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1768FF"/>
      <stop offset="1" stop-color="#22D9D2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="28" fill="#061431"/>
  <!-- 扁平化主图标：外轮廓保持方盒意象，中心留白形成连续运输路径。 -->
  <g transform="translate(104 74)" fill="none" stroke="url(#mark)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 126 216 12l198 114-198 114Z"/>
    <path d="M18 126v190l198 114V240"/>
    <path d="M414 126v190L216 430"/>
    <path d="M216 240 414 126"/>
  </g>
  <!-- 路径箭头，强化流转语义并保持小尺寸可读。 -->
  <path d="M493 261h97l-29-29m29 29-29 29" fill="none" stroke="#22D9D2" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#F7FAFF" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="610" y="266" font-size="92" font-weight="800" letter-spacing="-2">IDP</text>
    <text x="813" y="266" font-size="92" font-weight="500" letter-spacing="-3">Parcel</text>
    <text x="614" y="331" font-size="22" font-weight="500" letter-spacing="7" fill="#B7C9E8">GLOBAL DELIVERY, SIMPLIFIED.</text>
  </g>
</svg>
