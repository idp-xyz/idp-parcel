name: Parcel CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: parcel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    # 全仓 `go test -race` 带真库门禁已经跑不进 10 分钟：2026-09-04 run 33883842149 在
    # 10m20s 被掐（本机不带 -race、-p 1 就要将近 8 分）。上限只是防挂死，不是节奏目标——
    # 再超就该拆 job，不是再加。
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      # 集成门禁的连接串。GitHub Actions 自动设置 CI=true，因此这一项一旦缺失，
      # PostgreSQL 用例会失败而不是静默跳过。
      IDP_PARCEL_POSTGRES_DSN: postgres://parcel:parcel@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        # 与本机 compose.yaml 钉的是同一个精确补丁号。两处版本一旦分叉，
        # 本地通过而 CI 失败就成了版本差异而非代码问题，最难查。
        image: postgres:16.14
        env:
          POSTGRES_USER: parcel
          POSTGRES_PASSWORD: parcel
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parcel -d postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      # 清点工具自成一个模块（它要 golang.org/x/tools，而主模块的直接依赖只有三个，
      # 且那件事本身被开发主线当作「参数显式未配置」的佐证在引用）。因此根目录的
      # go vet / go test 扫不到它，要单列一步。
      - name: Vet and test the inventory tool
        working-directory: tools/mechanism-inventory
        run: |
          go vet ./...
          go test ./...

      # 与 gofmt 那一步同形：重新生成，与提交进来的那份不一致就红。清点报告因此不可能
      # 落后于代码——手工重盘二十七轮之后每一轮都带假，靠的正是没有这道门。
      - name: Mechanism inventory is current
        run: |
          (cd tools/mechanism-inventory && go run . -dir "$GITHUB_WORKSPACE" -out "$GITHUB_WORKSPACE/docs/product/MECHANISM-INVENTORY.md")
          # 用 status 不用 diff：diff 看不见未跟踪文件，报告一旦被删就会静默通过。
          test -z "$(git status --porcelain -- docs/product/MECHANISM-INVENTORY.md)"
