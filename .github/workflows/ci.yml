name: Parcel CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# main 上的推送不再互相顶掉。2026-09-04 一天里四次 run 被后续推送取消、没有一次跑完，
# 绿只在推送间隔 ≥ 25 分时出得来（tasks.md 09-04 23:2x）。拆片把单 run 压到十分钟上下，
# 缩的是窗口，机制还在——推送方的节奏本来就是重放几笔、清点一笔、台账一笔连着推，
# 间隔常在十分以内。关掉取消之后 GitHub 仍只保留一个排队中的 run（更新的顶掉排队的），
# 同组最多一跑一排，代价有界；换来的是每个正在跑的 SHA 一定出结论。PR 照旧取消：
# 旧 head 一旦被覆盖，它的结论没人要。
concurrency:
  group: parcel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    # 不含测试。拆片前的单 job 里，Test 之外的全部步骤（检出、装 Go、gofmt、vet、build、
    # 清点工具、清点门）合计约两分半——run 33887034470 Verify 23m25s 减 Test 21m06s。
    # 上限取四倍余量；上限只防挂死，不是节奏目标。
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # 清点工具自成一个模块（它要 golang.org/x/tools，而主模块的直接依赖只有三个，
      # 且那件事本身被开发主线当作「参数显式未配置」的佐证在引用）。因此根目录的
      # go vet / go test 扫不到它，要单列一步。
      - name: Vet and test the inventory tool
        working-directory: tools/mechanism-inventory
        run: |
          go vet ./...
          go test ./...

      # 与 gofmt 那一步同形：重新生成，与提交进来的那份不一致就红。清点报告因此不可能
      # 落后于代码——手工重盘二十七轮之后每一轮都带假，靠的正是没有这道门。
      - name: Mechanism inventory is current
        run: |
          (cd tools/mechanism-inventory && go run . -dir "$GITHUB_WORKSPACE" -out "$GITHUB_WORKSPACE/docs/product/MECHANISM-INVENTORY.md")
          # 用 status 不用 diff：diff 看不见未跟踪文件，报告一旦被删就会静默通过。
          test -z "$(git status --porcelain -- docs/product/MECHANISM-INVENTORY.md)"

      # 分片并集必须恰好等于 go list ./...：少一个包就是一块没人跑的测试而 CI 照样绿，
      # 多一个就是同一块跑两遍。兑底片按「全部 − 显式片」现算，新包天然落进去；这一步
      # 守的是显式片之间不重叠、没有哪一片被写空。
      - name: Test shards cover every package
        run: bash scripts/ci/test-shards.sh check

  shards:
    name: Enumerate test shards
    runs-on: ubuntu-24.04
    # 只检出、只打印片名，不装 Go 也不解析模块图。
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.names.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # 矩阵从脚本里读，不在这份文件里再抄一份片名：抄的那份在加片、并片时不会有任何
      # 门禁提醒它过期——脚本里新加的片若不进矩阵，那一片就再没人跑，而 check 看不见
      # 矩阵，只能靠这里把两者钉在同一处。先赋值再写出：脚本失败时让这一步自己红，
      # 不把空串写进输出、留给下游 fromJSON 去报一个不相干的错。
      - name: Read shard names
        id: names
        run: |
          matrix="$(bash scripts/ci/test-shards.sh matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.shard }})
    needs: shards
    runs-on: ubuntu-24.04
    strategy:
      # 一片红不掐其余片：读的人要的是「哪几个上下文红了」，掐掉之后只剩「有一片红」，
      # 还得再跑一遍才知道别的片绿不绿。
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.matrix) }}
    # 依据：2026-09-07 run 34135451794（d40e10e6，PR 取数）在 CI 上带 -race、-p 1、tmpfs 库实测，
    # 四片 Test 步 main-chain 301s / network-visibility 287s / customs-transport 268s / rest 366s，
    # 连检出、装 Go、起库算上 job 346 / 325 / 313 / 406s；再跑两次（run 34136273680、34136991369）
    # 最重 job 415s / 364s，逐包相差在几秒内。最重片是 15 分的 45–46%，未过六成线（9 分），
    # 上限不动。这些数以数据目录在 tmpfs 为前提（与 compose.yaml 同口径，见下面 services 那段）：
    # 不在 tmpfs 上时整片按那台 runner 的落盘延迟同倍数变慢——同一份代码，run 34115373617 慢
    # 4 倍、run 34133273333 慢 2 倍多，都撞了 15 分——所以 --tmpfs 那行不是可有可无的优化，
    # 删了它这里的依据就作废。编译缓存是热的（各片首个结果在第 3–45 秒印出），冷编译那一档
    # 还没量到——go.sum 变动后的第一跑若各片同时慢上两三分钟，先看这里再看代码。拆片时按本机
    # 116–132 秒乘 2.4 倍推的「各片约 5 分」数字大体对了，推法却不对：本机量的是 tmpfs 库、
    # -p 1，CI 当时是磁盘库、包并发，同代码同片从 4m30s 到 >15m 都出现过，与本机的倍数关系
    # 根本不稳；两边口径一致之后这个数才能拿来定上限。它只防挂死，不是节奏目标——哪一片
    # 再超就把那一片的上下文拆开，不是再加。
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      # 集成门禁的连接串。GitHub Actions 自动设置 CI=true，因此这一项一旦缺失，
      # PostgreSQL 用例会失败而不是静默跳过。每一片都带库：哪一片缺了它，那一片里的
      # 真库用例就整片 Fatal——不是跳过，所以不会有「拆片之后真库门禁悄悄没了」这种事。
      IDP_PARCEL_POSTGRES_DSN: postgres://parcel:parcel@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        # 与本机 compose.yaml 钉的是同一个精确补丁号。两处版本一旦分叉，
        # 本地通过而 CI 失败就成了版本差异而非代码问题，最难查。
        image: postgres:16.14
        env:
          POSTGRES_USER: parcel
          POSTGRES_PASSWORD: parcel
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # 数据目录落 tmpfs，与本机 compose.yaml 同口径（那边写明「数据落在内存里」，且不关
        # fsync）。夹具为每个用例建一个物理库再 DROP DATABASE（internal/platform/pgtest），
        # DROP 强制一次 checkpoint、迁移与事务提交各等一次 WAL 落盘——用例数乘以磁盘 fsync 的
        # 延迟就是真库包的耗时，而 runner 的磁盘快慢不由我们定。同一份代码同一片，run
        # 34115373617（b24ccccf）network-visibility 四个真库包 87 / 253 / 251 / 520 秒，对健康日
        # run 34084625114 的 21 / 74 / 62 / 166 秒一律慢 4 倍，1 秒档的纯内存包分毫不差——不是哪个
        # 包、哪个用例，是那台机器的落盘慢。加了 -p 1 之后（run 34133273333）这一片反而撞了
        # 15 分：包不再重叠，慢盘上的每一秒都直接进总时长；同一 run 另外三片的真库包比并发时
        # 快三成，说明锁等与落盘两笔账都在。本机 -p 1 各片 116–132 秒量的是 tmpfs 库，CI 拿磁盘
        # 库对着这个数推 timeout，口径从这里就错了。tmpfs 不改 PostgreSQL 任何参数，事务可见性
        # 与回滚语义照旧；这只库本来就是 job 结束即弃。size 与 compose.yaml 同为 2g。
        options: >-
          --health-cmd "pg_isready -U parcel -d postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
          --tmpfs /var/lib/postgresql/data:size=2g
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: true

      # 包清单由脚本给出。先赋值再展开，不走管道：默认 shell 没开 pipefail，管道里脚本
      # 红了 go test 照样会拿着空参数对仓库根跑一遍，报的是「没有 Go 文件」而不是真因。
      #
      # -count=1 关掉测试结果缓存。setup-go 的 cache:true 还原的是整个 go-build 缓存，上一次
      # run 的测试结果跟着一起回来；而 Go 判「可复用」只看文件与环境变量，不知道这一次的库
      # 是新起的——命中的包在本次 run 里一个用例都没跑，含真库的包也没碰过这个 service。
      # CI 要证明的是这一笔在干净库上过，缓存命中等于把证明记在了另一次 run 名下；本机验证
      # 的纪律本来就是 -count=1，CI 不该比本机松。它只关测试结果缓存，编译缓存照旧命中，
      # 代价是用例执行时间，不是全冷编译。写在 go test 行上而不是 GOFLAGS：与 -race 并排，
      # 这一片怎么跑在同一处看全，也不会捎带 static 那边清点工具的 go test。
      #
      # -p 1 让片内的包一个接一个跑。不带它时 go test 按 GOMAXPROCS 同时起多个包的测试二进制，
      # 而一片只有一只 service、一个库，各包的建库 / 删库 / 迁移 / 事务在同一个实例里互相等：
      # 一个包 DROP DATABASE 逼出的 checkpoint 让别的包的提交跟着等落盘。2026-09-07 三次红
      # 两笔账都在（落盘那笔见上面 services 那段）：run 34115373617（b24ccccf）network-visibility
      # 与 run 34121403815（fc90622a）rest 各 15m18s 撞上限——后者同一片同一份代码四次 run
      # 7m27s / 13m33s / 6m58s / >15m；run 34130024505（f69b35b9）customs-transport 里
      # customscompliance 与 transportfulfillment 两个 postgres 包各自 `panic: test timed out after
      # 10m0s`（go test 单个二进制的默认上限），goroutine 全停在 pgx Commit/Rollback 等服务端
      # 回包、当前用例才跑 6s / 0s——不是哪个用例挂死，是每个用例都在排队。串行之后同一份
      # 代码的真库包比并发时快三成（run 34133273333 对 34129503260）。本机验证口径一直是 `-p 1`
      # （AGENTS / parallel-sessions），CI 不该比本机并发。-p 也管编译动作的并发，但编译缓存是
      # 热的（run 34129503260 四片首个结果在第 3–70 秒印出），串行编译的代价有限；包内
      # t.Parallel 不受影响。
      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          packages="$(bash scripts/ci/test-shards.sh list "$SHARD")"
          go test -race -count=1 -p 1 $packages
