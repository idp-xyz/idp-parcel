openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: International Parcel Rating API
  version: 1.0.1
  summary: Deterministic rating, eligibility, comparison, batch and quote API.
  description: Aligned with Platform V1.2, Domain Model V1.0.1, Runtime Semantics V1.0.1 and Golden Cases V1.0.1.
servers:
- url: https://api.example.invalid
  description: Deployment placeholder.
tags:
- name: Eligibility
- name: Rating
- name: Comparison
- name: Batch
- name: Quote
security:
- bearerAuth: []
paths:
  /v1/eligibility-evaluations:
    post:
      tags:
      - Eligibility
      summary: Evaluate service eligibility
      operationId: createEligibilityEvaluation
      x-required-scopes:
      - eligibility:evaluate
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EligibilityEvaluationCreateRequest'
            examples:
              default:
                $ref: '#/components/examples/EligibilityRequestExample'
      responses:
        '201':
          description: Eligibility evaluation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityEvaluation'
              examples:
                default:
                  $ref: '#/components/examples/EligibilityEvaluationExample'
          headers:
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
            Idempotency-Replayed:
              schema:
                type: boolean
            Location:
              schema:
                type: string
                format: uri-reference
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '409': &id004
          $ref: '#/components/responses/Conflict'
        '422': &id005
          $ref: '#/components/responses/Unprocessable'
        '429': &id006
          $ref: '#/components/responses/TooManyRequests'
        '500': &id007
          $ref: '#/components/responses/InternalError'
        '503': &id008
          $ref: '#/components/responses/ServiceUnavailable'
        '504': &id009
          $ref: '#/components/responses/GatewayTimeout'
  /v1/ratings/evaluate:
    post:
      tags:
      - Rating
      summary: Create one immutable RatingEvaluation
      operationId: evaluateRating
      x-required-scopes:
      - rating:evaluate
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/PreferAsync'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingEvaluationCreateRequest'
            examples:
              default:
                $ref: '#/components/examples/RatingEvaluationCreateRequestExample'
      responses:
        '201':
          description: Evaluation completed and persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingEvaluation'
              examples:
                default:
                  $ref: '#/components/examples/RatingEvaluationExample'
          headers:
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
            Idempotency-Replayed:
              schema:
                type: boolean
            Location:
              schema:
                type: string
                format: uri-reference
        '202':
          description: Evaluation accepted for asynchronous completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
          headers:
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
            Idempotency-Replayed:
              schema:
                type: boolean
            Location:
              schema:
                type: string
                format: uri-reference
        '400': *id001
        '401': *id002
        '403': *id003
        '409': *id004
        '422': *id005
        '429': *id006
        '500': *id007
        '503': *id008
        '504': *id009
  /v1/rating-evaluations/{evaluation_id}:
    get:
      tags:
      - Rating
      summary: Read an immutable RatingEvaluation
      operationId: getRatingEvaluation
      x-required-scopes:
      - rating:read
      parameters:
      - $ref: '#/components/parameters/EvaluationId'
      - $ref: '#/components/parameters/Include'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Authorized evaluation projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingEvaluation'
              examples:
                default:
                  $ref: '#/components/examples/RatingEvaluationExample'
          headers:
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
            ETag:
              schema:
                type: string
                maxLength: 128
        '304':
          description: Not modified.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/rating-evaluations/{evaluation_id}/replays:
    post:
      tags:
      - Rating
      summary: Replay using original immutable artifacts
      operationId: replayRatingEvaluation
      x-required-scopes:
      - rating:replay
      parameters:
      - $ref: '#/components/parameters/EvaluationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/PreferAsync'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayRequest'
      responses:
        '201':
          description: Replay completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResponse'
          headers:
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
            Idempotency-Replayed:
              schema:
                type: boolean
            Location:
              schema:
                type: string
                format: uri-reference
        '202':
          description: Replay accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
          headers:
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
            Idempotency-Replayed:
              schema:
                type: boolean
            Location:
              schema:
                type: string
                format: uri-reference
        '404':
          $ref: '#/components/responses/NotFound'
        '400': *id001
        '401': *id002
        '403': *id003
        '409': *id004
        '422': *id005
        '429': *id006
        '500': *id007
        '503': *id008
        '504': *id009
  /v1/rating-comparisons:
    post:
      tags:
      - Comparison
      summary: Compare candidate service products
      operationId: createRatingComparison
      x-required-scopes:
      - rating:compare
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/PreferAsync'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingComparisonCreateRequest'
            examples:
              default:
                $ref: '#/components/examples/RatingComparisonRequestExample'
      responses:
        '201':
          description: Comparison completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingComparison'
              examples:
                default:
                  $ref: '#/components/examples/RatingComparisonExample'
          headers:
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
            Idempotency-Replayed:
              schema:
                type: boolean
            Location:
              schema:
                type: string
                format: uri-reference
        '202':
          description: Comparison accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
          headers:
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
            Idempotency-Replayed:
              schema:
                type: boolean
            Location:
              schema:
                type: string
                format: uri-reference
        '400': *id001
        '401': *id002
        '403': *id003
        '409': *id004
        '422': *id005
        '429': *id006
        '500': *id007
        '503': *id008
        '504': *id009
  /v1/rating-batches:
    post:
      tags:
      - Batch
      summary: Submit asynchronous rating batch
      operationId: createRatingBatch
      x-required-scopes:
      - rating:batch
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingBatchCreateRequest'
            examples:
              default:
                $ref: '#/components/examples/RatingBatchRequestExample'
      responses:
        '202':
          description: Batch accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingBatchJob'
              examples:
                default:
                  $ref: '#/components/examples/RatingBatchJobExample'
          headers:
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
            Idempotency-Replayed:
              schema:
                type: boolean
            Location:
              schema:
                type: string
                format: uri-reference
        '400': *id001
        '401': *id002
        '403': *id003
        '409': *id004
        '422': *id005
        '429': *id006
        '500': *id007
        '503': *id008
        '504': *id009
  /v1/rating-batches/{batch_id}:
    get:
      tags:
      - Batch
      summary: Read batch status
      operationId: getRatingBatch
      x-required-scopes:
      - rating:batch:read
      parameters:
      - $ref: '#/components/parameters/BatchId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Batch status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingBatchJob'
              examples:
                default:
                  $ref: '#/components/examples/RatingBatchJobExample'
          headers:
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
            ETag:
              schema:
                type: string
                maxLength: 128
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/rating-batches/{batch_id}/results:
    get:
      tags:
      - Batch
      summary: Read paged batch results
      operationId: getRatingBatchResults
      x-required-scopes:
      - rating:batch:read
      parameters:
      - $ref: '#/components/parameters/BatchId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Batch result page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingBatchResultsPage'
          headers:
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
            ETag:
              schema:
                type: string
                maxLength: 128
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/quotes:
    post:
      tags:
      - Quote
      summary: Create DRAFT Quote from completed SELL/PUBLIC evaluation
      operationId: createQuote
      x-required-scopes:
      - quote:create
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteCreateRequest'
            examples:
              default:
                $ref: '#/components/examples/QuoteCreateRequestExample'
      responses:
        '201':
          description: DRAFT Quote created; no Assessment or financial charge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
              examples:
                default:
                  $ref: '#/components/examples/QuoteExample'
          headers:
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
            Idempotency-Replayed:
              schema:
                type: boolean
            Location:
              schema:
                type: string
                format: uri-reference
            ETag:
              schema:
                type: string
                maxLength: 128
        '400': *id001
        '401': *id002
        '403': *id003
        '409': *id004
        '422': *id005
        '429': *id006
        '500': *id007
        '503': *id008
        '504': *id009
  /v1/quotes/{quote_id}:
    get:
      tags:
      - Quote
      summary: Read Quote
      operationId: getQuote
      x-required-scopes:
      - quote:read
      parameters:
      - $ref: '#/components/parameters/QuoteId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
              examples:
                default:
                  $ref: '#/components/examples/QuoteExample'
          headers:
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
            ETag:
              schema:
                type: string
                maxLength: 128
        '304':
          description: Not modified.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/quotes/{quote_id}/offer:
    post:
      tags:
      - Quote
      summary: Offer a DRAFT Quote
      operationId: offerQuote
      x-required-scopes:
      - quote:offer
      parameters:
      - $ref: '#/components/parameters/QuoteId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteTransitionRequest'
      responses:
        '200':
          description: Quote is OFFERED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
          headers:
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
            Idempotency-Replayed:
              schema:
                type: boolean
            ETag:
              schema:
                type: string
                maxLength: 128
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '400': *id001
        '401': *id002
        '403': *id003
        '409': *id004
        '422': *id005
        '429': *id006
        '500': *id007
        '503': *id008
        '504': *id009
  /v1/quotes/{quote_id}/accept:
    post:
      tags:
      - Quote
      summary: Accept an OFFERED Quote
      operationId: acceptQuote
      x-required-scopes:
      - quote:accept
      parameters:
      - $ref: '#/components/parameters/QuoteId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteTransitionRequest'
      responses:
        '200':
          description: Quote is ACCEPTED; no ChargeAssessment is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
          headers:
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
            Idempotency-Replayed:
              schema:
                type: boolean
            ETag:
              schema:
                type: string
                maxLength: 128
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '400': *id001
        '401': *id002
        '403': *id003
        '409': *id004
        '422': *id005
        '429': *id006
        '500': *id007
        '503': *id008
        '504': *id009
  /v1/quotes/{quote_id}/cancel:
    post:
      tags:
      - Quote
      summary: Cancel a DRAFT or OFFERED Quote
      operationId: cancelQuote
      x-required-scopes:
      - quote:cancel
      parameters:
      - $ref: '#/components/parameters/QuoteId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteTransitionRequest'
      responses:
        '200':
          description: Quote is CANCELLED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
          headers:
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
            Idempotency-Replayed:
              schema:
                type: boolean
            ETag:
              schema:
                type: string
                maxLength: 128
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '400': *id001
        '401': *id002
        '403': *id003
        '409': *id004
        '422': *id005
        '429': *id006
        '500': *id007
        '503': *id008
        '504': *id009
  /v1/quotes/{quote_id}/repricings:
    post:
      tags:
      - Quote
      summary: Create a new QuoteVersion from a new evaluation
      operationId: repriceQuote
      x-required-scopes:
      - quote:reprice
      parameters:
      - $ref: '#/components/parameters/QuoteId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRepriceRequest'
      responses:
        '201':
          description: New QuoteVersion created; history retained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
          headers:
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
            Idempotency-Replayed:
              schema:
                type: boolean
            Location:
              schema:
                type: string
                format: uri-reference
            ETag:
              schema:
                type: string
                maxLength: 128
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '400': *id001
        '401': *id002
        '403': *id003
        '409': *id004
        '422': *id005
        '429': *id006
        '500': *id007
        '503': *id008
        '504': *id009
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    PreferAsync:
      name: Prefer
      in: header
      required: false
      schema:
        type: string
        enum:
        - respond-sync
        - respond-async
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    EvaluationId:
      name: evaluation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    QuoteId:
      name: quote_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    BatchId:
      name: batch_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    Include:
      name: include
      in: query
      required: false
      schema:
        type: array
        uniqueItems: true
        items:
          type: string
          enum:
          - lines
          - trace
          - evidence
          - commercial_summary
      style: form
      explode: false
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
  responses:
    BadRequest:
      description: Malformed request or unsupported field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            default:
              $ref: '#/components/examples/ProblemExample'
      headers:
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      headers:
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
    Forbidden:
      description: Insufficient tenant, role or field permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      headers:
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
    NotFound:
      description: Resource not found or not visible.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      headers:
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
    Conflict:
      description: Idempotency, state or version conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      headers:
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
    PreconditionFailed:
      description: ETag precondition failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      headers:
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
    Unprocessable:
      description: Business semantic, eligibility, fact, rate or calculation error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            default:
              $ref: '#/components/examples/ProblemExample'
      headers:
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalError:
      description: Unexpected system error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      headers:
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
    ServiceUnavailable:
      description: Required dependency unavailable.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    GatewayTimeout:
      description: Execution timed out; no partial formal total.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      headers:
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    DecimalString:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
    NonNegativeDecimalString:
      type: string
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
    CurrencyCode:
      type: string
      pattern: ^[A-Z]{3}$
    CountryCode:
      type: string
      pattern: ^[A-Z]{2}$
    CalculationPurpose:
      type: string
      enum:
      - QUOTE
      - ESTIMATED_COST
      - ACTUAL_COST
      - CUSTOMER_BILLING
      - SIMULATION
      - REPLAY
      - DISPUTE_REVIEW
    PriceRole:
      type: string
      enum:
      - CARRIER_TARIFF
      - BUY
      - INTERNAL
      - SELL
      - PUBLIC
    ChargeScope:
      type: string
      enum:
      - PACKAGE
      - SHIPMENT
      - ORDER
      - MANIFEST
      - CONTAINER
      - INVOICE
      - SETTLEMENT_PERIOD
    ChargeBasisType:
      type: string
      enum:
      - NONE
      - WEIGHT
      - VOLUME
      - PIECE_COUNT
      - DECLARED_VALUE
      - BASE_FREIGHT
      - SELECTED_CHARGES
      - TOTAL_BEFORE_DISCOUNT
      - TOTAL_AFTER_DISCOUNT
      - EXCESS_WEIGHT
      - EXCESS_DIMENSION
      - DAYS
      - LOOKUP_RESULT
      - CUSTOM_BASIS
    ChargeMethodType:
      type: string
      enum:
      - FIXED
      - PER_UNIT
      - PERCENTAGE
      - LOOKUP
      - TIERED_BANDED
      - TIERED_PROGRESSIVE
      - MINIMUM_ADJUSTMENT
      - MAXIMUM_CAP
      - MAX_OF
      - FORMULA_TEMPLATE
      - CUSTOM_FUNCTION
    RatingAggregationMode:
      type: string
      enum:
      - PER_PACKAGE
      - SHIPMENT_TOTAL
      - FIRST_CONTINUE_SHIPMENT
      - MASTER_PLUS_CHILD
      - HYBRID
    ChargeEffect:
      type: string
      enum:
      - ADD
      - DEDUCT
    RoundingMode:
      type: string
      enum:
      - CEILING
      - FLOOR
      - HALF_UP
      - HALF_EVEN
      - UP
      - DOWN
    CalculationBasis:
      type: string
      enum:
      - SYSTEM_RECALCULATION
      - CARRIER_ASSESSMENT
    EvaluationStatus:
      type: string
      enum:
      - REQUESTED
      - EVALUATING
      - COMPLETED
      - FAILED
      - CANCELLED
    QuoteStatus:
      type: string
      enum:
      - DRAFT
      - OFFERED
      - ACCEPTED
      - EXPIRED
      - CANCELLED
      - SUPERSEDED
    Money:
      type: object
      additionalProperties: false
      properties:
        amount:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      required:
      - amount
      - currency
    WeightValue:
      type: object
      additionalProperties: false
      properties:
        value:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        unit:
          type: string
          enum:
          - G
          - KG
          - LB
          - OZ
      required:
      - value
      - unit
    LengthValue:
      type: object
      additionalProperties: false
      properties:
        value:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        unit:
          type: string
          enum:
          - MM
          - CM
          - M
          - IN
          - FT
      required:
      - value
      - unit
    VolumeValue:
      type: object
      additionalProperties: false
      properties:
        value:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        unit:
          type: string
          enum:
          - MM3
          - CM3
          - M3
          - IN3
          - FT3
      required:
      - value
      - unit
    Dimensions:
      type: object
      additionalProperties: false
      properties:
        length:
          $ref: '#/components/schemas/LengthValue'
        width:
          $ref: '#/components/schemas/LengthValue'
        height:
          $ref: '#/components/schemas/LengthValue'
      required:
      - length
      - width
      - height
    AddressSnapshot:
      type: object
      additionalProperties: false
      properties:
        country_code:
          $ref: '#/components/schemas/CountryCode'
        postal_code:
          type: string
          maxLength: 32
        state_or_region:
          type: string
          maxLength: 128
        city:
          type: string
          maxLength: 128
        address_line_1:
          type: string
          maxLength: 256
        declared_address_type:
          type: string
          enum:
          - RESIDENTIAL
          - COMMERCIAL
          - PO_BOX
          - UNKNOWN
        source_system:
          type: string
          maxLength: 64
      required:
      - country_code
    ServiceOption:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - SIGNATURE
          - ADULT_SIGNATURE
          - INSURANCE
          - RETURN_SERVICE
          - SATURDAY_DELIVERY
        requested:
          type: boolean
        declared_value:
          $ref: '#/components/schemas/Money'
      required:
      - code
      - requested
    PackageSnapshot:
      type: object
      additionalProperties: false
      properties:
        package_id:
          $ref: '#/components/schemas/Identifier'
        package_sequence:
          type: integer
          minimum: 1
        master_package:
          type: boolean
        packaging_type:
          type: string
          enum:
          - CUSTOMER_PACKAGING
          - CARRIER_BOX
          - POLY_BAG
          - TUBE
          - ENVELOPE
          - PALLET
          - IRREGULAR
          - UNKNOWN
        shape_type:
          type: string
          enum:
          - RECTANGULAR
          - SOFT
          - IRREGULAR
          - CYLINDRICAL
          - UNKNOWN
        declared_value:
          $ref: '#/components/schemas/Money'
        service_options:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ServiceOption'
        external_reference:
          type: string
          maxLength: 128
      required:
      - package_id
    ShipmentSnapshot:
      type: object
      additionalProperties: false
      properties:
        shipment_id:
          $ref: '#/components/schemas/Identifier'
        order_id:
          $ref: '#/components/schemas/Identifier'
        origin:
          $ref: '#/components/schemas/AddressSnapshot'
        destination:
          $ref: '#/components/schemas/AddressSnapshot'
        packages:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/PackageSnapshot'
        external_reference:
          type: string
          maxLength: 128
      required:
      - shipment_id
      - origin
      - destination
      - packages
    MeasurementFactInput:
      type: object
      additionalProperties: false
      properties:
        fact_id:
          $ref: '#/components/schemas/Identifier'
        package_id:
          $ref: '#/components/schemas/Identifier'
        source_type:
          type: string
          enum:
          - CUSTOMER_DECLARED
          - ORDER_IMPORTED
          - WAREHOUSE_MANUAL
          - WAREHOUSE_DWS
          - CARRIER_SCAN
          - MANUAL_AUDIT
        source_system:
          type: string
          maxLength: 64
        measured_at:
          type: string
          format: date-time
        actual_weight:
          $ref: '#/components/schemas/WeightValue'
        dimensions:
          $ref: '#/components/schemas/Dimensions'
        equipment_id:
          $ref: '#/components/schemas/Identifier'
        evidence_uri:
          type: string
          format: uri
        supersedes_fact_id:
          $ref: '#/components/schemas/Identifier'
      required:
      - fact_id
      - package_id
      - source_type
      - measured_at
      anyOf:
      - required:
        - actual_weight
      - required:
        - dimensions
    CarrierAssessmentFactInput:
      type: object
      additionalProperties: false
      properties:
        fact_id:
          $ref: '#/components/schemas/Identifier'
        package_id:
          $ref: '#/components/schemas/Identifier'
        assessed_at:
          type: string
          format: date-time
        carrier_id:
          $ref: '#/components/schemas/Identifier'
        assessed_actual_weight:
          $ref: '#/components/schemas/WeightValue'
        assessed_dimensional_weight:
          $ref: '#/components/schemas/WeightValue'
        applied_minimum_weight:
          $ref: '#/components/schemas/WeightValue'
        billed_weight:
          $ref: '#/components/schemas/WeightValue'
        billed_zone:
          type: string
          maxLength: 32
        address_classification:
          type: string
          enum:
          - RESIDENTIAL
          - COMMERCIAL
          - PO_BOX
          - UNKNOWN
        remote_classification:
          type: string
          enum:
          - NONE
          - REMOTE
          - EXTENDED
          - ALASKA
          - HAWAII
          - OTHER
        invoice_line_reference:
          type: string
          maxLength: 128
      required:
      - fact_id
      - package_id
      - assessed_at
      anyOf:
      - required:
        - billed_weight
      - required:
        - assessed_actual_weight
      - required:
        - assessed_dimensional_weight
      - required:
        - applied_minimum_weight
    BusinessTimeSelector:
      type: object
      additionalProperties: false
      properties:
        policy:
          type: string
          enum:
          - PRICE_AS_OF_QUOTED_AT
          - PRICE_AS_OF_LABEL_CREATED
          - PRICE_AS_OF_WAREHOUSE_SHIPPED
          - PRICE_AS_OF_CARRIER_ACCEPTED
          - PRICE_AS_OF_INVOICE_DATE
          - EXPLICIT_BUSINESS_TIME
        value:
          type: string
          format: date-time
      required:
      - policy
      allOf:
      - if:
          properties:
            policy:
              const: EXPLICIT_BUSINESS_TIME
        then:
          required:
          - value
    VersionRef:
      type: object
      additionalProperties: false
      properties:
        component_type:
          type: string
          maxLength: 64
        component_id:
          $ref: '#/components/schemas/Identifier'
        version:
          type: string
          maxLength: 64
        content_hash:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
      required:
      - component_type
      - component_id
      - version
      - content_hash
    PricingSelection:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
          - ACTIVE_RELEASE
          - PINNED_RELEASE
          - EXPLICIT_COMPONENTS
        pricing_release_id:
          $ref: '#/components/schemas/Identifier'
        component_versions:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/VersionRef'
      required:
      - mode
      allOf:
      - if:
          properties:
            mode:
              const: PINNED_RELEASE
        then:
          required:
          - pricing_release_id
      - if:
          properties:
            mode:
              const: EXPLICIT_COMPONENTS
        then:
          required:
          - component_versions
    RatingContext:
      type: object
      additionalProperties: false
      properties:
        customer_id:
          $ref: '#/components/schemas/Identifier'
        contract_id:
          $ref: '#/components/schemas/Identifier'
        service_product_id:
          $ref: '#/components/schemas/Identifier'
        origin_warehouse_id:
          $ref: '#/components/schemas/Identifier'
        carrier_account_id:
          $ref: '#/components/schemas/Identifier'
        organization_id:
          $ref: '#/components/schemas/Identifier'
      required:
      - customer_id
      - contract_id
      - service_product_id
    ComparisonContext:
      type: object
      additionalProperties: false
      properties:
        customer_id:
          $ref: '#/components/schemas/Identifier'
        contract_id:
          $ref: '#/components/schemas/Identifier'
        origin_warehouse_id:
          $ref: '#/components/schemas/Identifier'
        organization_id:
          $ref: '#/components/schemas/Identifier'
      required:
      - customer_id
      - contract_id
    RequestMetadata:
      type: object
      maxProperties: 32
      propertyNames:
        pattern: ^[a-z0-9]+(?:[._-][a-z0-9]+)*$
      additionalProperties:
        type: string
        maxLength: 256
    RatingOptions:
      type: object
      additionalProperties: false
      properties:
        include_trace:
          type: boolean
        include_evidence:
          type: boolean
        fail_on_warning:
          type: boolean
        requested_projection:
          type: string
          enum:
          - SUMMARY
          - CUSTOMER
          - INTERNAL
    RatingEvaluationCreateRequest:
      type: object
      additionalProperties: false
      properties:
        calculation_purpose:
          $ref: '#/components/schemas/RatingCreatePurpose'
        price_role:
          $ref: '#/components/schemas/PriceRole'
        calculation_basis:
          $ref: '#/components/schemas/CalculationBasis'
        business_time:
          $ref: '#/components/schemas/BusinessTimeSelector'
        pricing:
          $ref: '#/components/schemas/PricingSelection'
        context:
          $ref: '#/components/schemas/RatingContext'
        shipment:
          $ref: '#/components/schemas/ShipmentSnapshot'
        measurement_facts:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/MeasurementFactInput'
        carrier_assessment_facts:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/CarrierAssessmentFactInput'
        options:
          $ref: '#/components/schemas/RatingOptions'
        metadata:
          $ref: '#/components/schemas/RequestMetadata'
      required:
      - calculation_purpose
      - price_role
      - business_time
      - pricing
      - context
      - shipment
      allOf:
      - if:
          properties:
            calculation_purpose:
              const: ACTUAL_COST
          required:
          - calculation_purpose
        then:
          required:
          - calculation_basis
      - if:
          properties:
            pricing:
              properties:
                mode:
                  const: EXPLICIT_COMPONENTS
              required:
              - mode
          required:
          - pricing
        then:
          properties:
            calculation_purpose:
              const: SIMULATION
    EligibilityEvaluationCreateRequest:
      type: object
      additionalProperties: false
      properties:
        business_time:
          $ref: '#/components/schemas/BusinessTimeSelector'
        context:
          $ref: '#/components/schemas/RatingContext'
        shipment:
          $ref: '#/components/schemas/ShipmentSnapshot'
        measurement_facts:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/MeasurementFactInput'
        metadata:
          $ref: '#/components/schemas/RequestMetadata'
      required:
      - business_time
      - context
      - shipment
    SelectedFactReference:
