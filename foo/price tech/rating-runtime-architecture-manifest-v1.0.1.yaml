manifest_version: 1.0.1
design_name: International Parcel Rating Runtime
architecture_style: modular_monolith_with_horizontally_scalable_workers
language_baseline:
  reference_implementation: Go
  version_policy: project-pinned stable toolchain
  numeric_rule: decimal_only_no_binary_float_for_business_values
required_infrastructure:
- PostgreSQL
- ObjectStorage
optional_infrastructure:
- Redis
- ExternalMessageBroker
semantic_hot_path_must_not_require:
- Redis
- ExternalMessageBroker
- WorkflowEngine
- RemoteRuleEvaluation
- NonDeterministicInference
services:
- name: rating-api
  deployment: required
  responsibilities:
  - HTTP authentication and authorization projection
  - request validation and idempotency admission
  - synchronous rating commands and resource queries
  - quote commands
  modules:
  - http-adapter
  - rating-application
  - comparison-application
  - quote-application
- name: rating-worker
  deployment: required_for_async
  responsibilities:
  - asynchronous evaluation execution
  - batch item execution
  - replay execution
  modules:
  - rating-application
  - batch-application
  - stage-executor
- name: outbox-publisher
  deployment: required
  responsibilities:
  - publish committed domain events from transactional outbox
  modules:
  - outbox-publisher
- name: plan-compiler
  deployment: pricing_governance_boundary
  responsibilities:
  - validate released pricing components
  - compile immutable pricing artifacts
  - publish content-addressed artifacts
  modules:
  - compiled-plan-runtime
  - pricing-catalog-domain
  - contract-policy-domain
modules:
- name: shared-kernel
  layer: domain
  depends_on: []
- name: product-eligibility-domain
  layer: domain
  depends_on:
  - shared-kernel
- name: contract-policy-domain
  layer: domain
  depends_on:
  - shared-kernel
- name: pricing-catalog-domain
  layer: domain
  depends_on:
  - shared-kernel
- name: facts-domain
  layer: domain
  depends_on:
  - shared-kernel
- name: rating-domain
  layer: domain
  depends_on:
  - shared-kernel
- name: quote-domain
  layer: domain
  depends_on:
  - shared-kernel
- name: rating-ports
  layer: application
  depends_on:
  - shared-kernel
  - product-eligibility-domain
  - contract-policy-domain
  - pricing-catalog-domain
  - facts-domain
  - rating-domain
- name: decimal-kernel
  layer: engine
  depends_on:
  - shared-kernel
- name: unit-kernel
  layer: engine
  depends_on:
  - shared-kernel
  - decimal-kernel
- name: geometry-engine
  layer: engine
  depends_on:
  - shared-kernel
  - decimal-kernel
  - unit-kernel
  - facts-domain
- name: weight-engine
  layer: engine
  depends_on:
  - shared-kernel
  - decimal-kernel
  - unit-kernel
  - geometry-engine
  - facts-domain
- name: geography-engine
  layer: engine
  depends_on:
  - shared-kernel
  - pricing-catalog-domain
  - facts-domain
- name: rate-lookup-engine
  layer: engine
  depends_on:
  - shared-kernel
  - decimal-kernel
  - pricing-catalog-domain
- name: charge-engine
  layer: engine
  depends_on:
  - shared-kernel
  - decimal-kernel
  - unit-kernel
  - rate-lookup-engine
  - pricing-catalog-domain
  - rating-domain
- name: currency-engine
  layer: engine
  depends_on:
  - shared-kernel
  - decimal-kernel
  - pricing-catalog-domain
- name: aggregation-engine
  layer: engine
  depends_on:
  - shared-kernel
  - decimal-kernel
  - weight-engine
  - rating-domain
- name: compiled-plan-runtime
  layer: engine
  depends_on:
  - shared-kernel
  - pricing-catalog-domain
  - contract-policy-domain
  - rating-domain
- name: stage-executor
  layer: engine
  depends_on:
  - shared-kernel
  - rating-domain
  - compiled-plan-runtime
  - geometry-engine
  - weight-engine
  - geography-engine
  - rate-lookup-engine
  - charge-engine
  - currency-engine
  - aggregation-engine
- name: rating-application
  layer: application
  depends_on:
  - shared-kernel
  - rating-ports
  - product-eligibility-domain
  - contract-policy-domain
  - facts-domain
  - rating-domain
  - compiled-plan-runtime
  - stage-executor
- name: comparison-application
  layer: application
  depends_on:
  - shared-kernel
  - rating-application
  - rating-domain
- name: batch-application
  layer: application
  depends_on:
  - shared-kernel
  - rating-application
  - rating-domain
- name: quote-application
