execution_stages:
- sequence: 1
  name: RequestValidation
  deterministic: true
- sequence: 2
  name: PurposeAndTimeResolution
  deterministic: true
- sequence: 3
  name: SnapshotValidation
  deterministic: true
- sequence: 4
  name: ProductEligibility
  deterministic: true
- sequence: 5
  name: ContractPolicyResolution
  deterministic: true
- sequence: 6
  name: VersionManifestResolution
  deterministic: true
- sequence: 7
  name: FactSelection
  deterministic: true
- sequence: 8
  name: UnitNormalization
  deterministic: true
- sequence: 9
  name: GeometryNormalization
  deterministic: true
- sequence: 10
  name: AddressAndGeographyClassification
  deterministic: true
- sequence: 11
  name: PackageFeatureEvaluation
  deterministic: true
- sequence: 12
  name: WeightCalculation
  deterministic: true
- sequence: 13
  name: Aggregation
  deterministic: true
- sequence: 14
  name: BaseRateLookup
  deterministic: true
- sequence: 15
  name: CandidateChargeGeneration
  deterministic: true
- sequence: 16
  name: ChargeBasisResolution
  deterministic: true
- sequence: 17
  name: ChargeMethodExecution
  deterministic: true
- sequence: 18
  name: ChargeComposition
  deterministic: true
- sequence: 19
  name: DerivedCharges
  deterministic: true
- sequence: 20
  name: BuySellTransformation
  deterministic: true
- sequence: 21
  name: MinimumAndCap
  deterministic: true
- sequence: 22
  name: MultiLegAndShipmentSummary
  deterministic: true
- sequence: 23
  name: CurrencyConversion
  deterministic: true
- sequence: 24
  name: RoundingFinalization
  deterministic: true
- sequence: 25
  name: EvaluationValidation
  deterministic: true
- sequence: 26
  name: RatingEvaluationBuild
  deterministic: true
core_enums:
  CalculationPurpose:
  - QUOTE
  - ESTIMATED_COST
  - ACTUAL_COST
  - CUSTOMER_BILLING
  - SIMULATION
  - REPLAY
  - DISPUTE_REVIEW
  PriceRole:
  - CARRIER_TARIFF
  - BUY
  - INTERNAL
  - SELL
  - PUBLIC
  ChargeEffect:
  - ADD
  - DEDUCT
  EvaluationStatus:
  - REQUESTED
  - EVALUATING
  - COMPLETED
  - FAILED
  - CANCELLED
  RatingAggregationMode:
  - PER_PACKAGE
  - SHIPMENT_TOTAL
  - FIRST_CONTINUE_SHIPMENT
  - MASTER_PLUS_CHILD
  - HYBRID
persistence_ports:
- IdempotencyRepository
- RatingEvaluationRepository
- RatingSnapshotRepository
- PricingReleaseRepository
- CompiledPlanArtifactRepository
- FactRepository
- QuoteRepository
- OperationRepository
- OutboxRepository
cache_layers:
- name: L1ProcessCache
  required: true
  key: artifact_content_hash
  semantic_eviction: release_or_content_hash_change
- name: L2DistributedCache
  required: false
  key: artifact_content_hash
  semantic_eviction: release_or_content_hash_change
api_operation_mappings:
  createEligibilityEvaluation: rating-api
  evaluateRating: rating-api
  getRatingEvaluation: rating-api
  replayRatingEvaluation: rating-worker
  createRatingComparison: rating-api
  createRatingBatch: rating-api
  getRatingBatch: rating-api
  getRatingBatchResults: rating-api
  createQuote: rating-api
  getQuote: rating-api
  offerQuote: rating-api
  acceptQuote: rating-api
  cancelQuote: rating-api
  repriceQuote: rating-api
forbidden_dependencies:
- from_layer: domain
  to_layers:
  - application
  - adapter
  - infrastructure
- from_layer: engine
  to_layers:
  - adapter
  - infrastructure
